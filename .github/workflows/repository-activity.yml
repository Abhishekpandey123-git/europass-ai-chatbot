name: Repository Activity Monitor

on:
  push:
    branches:
      - "**"

  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed

permissions:
  contents: read
  pull-requests: read

jobs:
  detect-activity:
    runs-on: ubuntu-latest

    steps:
      - name: Report activity
        run: |
          echo "Repository activity detected"
          echo "Event: ${{ github.event_name }}"
          echo "Actor: ${{ github.actor }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
